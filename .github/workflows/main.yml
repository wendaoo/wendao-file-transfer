name: wendao macOS source validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check publishable source content
        run: python3 scripts/shared/check-git-content.py
      - name: Install project-local toolchain and dependencies
        run: bash scripts/shared/bootstrap.sh
      - name: Verify source build resources
        run: |
          node scripts/shared/check-resources.cjs
      - name: Device routing and transfer regressions
        run: bash scripts/shared/build.sh test
      - name: Compile application source
        run: bash scripts/shared/build.sh build-source
      # Installer upload is paused until the runtime and native license review is complete.
